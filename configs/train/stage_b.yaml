data: {manifest: data/manifests/train.jsonl, image_size: 512, d_max: 32}
train:
  stage: b
  objective: single_turn_joint
  epochs: 1
  batch_size: 1
  learning_rate: 0.0001
  loss: {text: 1.0, dice: 1.0, bce: 1.0}
  precision: bf16
  max_steps: 3000
  gradient_accumulation: 8
  warmup_steps: 200
  weight_decay: 0.01
  encoder_learning_rate: 0.0
  lora_learning_rate: 0.0001
  delta_learning_rate: 0.0001
  empty_target_policy: include
  history_mode: oracle
