data: {manifest: data/manifests/train.jsonl, image_size: 512, d_max: 32}
train:
  stage: a
  objective: segmentation_warmup
  epochs: 1
  batch_size: 1
  learning_rate: 0.0001
  encoder_learning_rate: 0.0
  precision: bf16
  decoder_precision: fp32
  max_steps: 1000
  gradient_accumulation: 8
  warmup_steps: 100
  weight_decay: 0.01
  empty_target_policy: include
  loss: {text: 0.0, mask: 1.0}
  history_mode: oracle
